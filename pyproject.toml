[project]
name = "freshretailnet-tsfm"
version = "0.1.0"
description = "Auditable stockout-aware TSFM forecasting on FreshRetailNet-50K."
requires-python = ">=3.10"
dependencies = [
  "chronos-forecasting>=2.3,<3",
  "datasets>=3.0,<5",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<20",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
  "lightgbm>=4.5,<5",
  "neuralforecast>=3.2,<4",
  "statsforecast>=2.1,<3",
  "peft>=0.19,<1",
  "accelerate>=1.0,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
